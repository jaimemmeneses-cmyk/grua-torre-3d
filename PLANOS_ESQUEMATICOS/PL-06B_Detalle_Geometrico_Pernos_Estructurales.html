    <!-- FONDO Y RECUADRO TÉCNICO -->
    <rect width="1600" height="1000" fill="url(#bg-grad)"/>
    <rect x="20" y="20" width="1560" height="960" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <rect x="25" y="25" width="1550" height="950" fill="none" stroke="#1e3a5f" stroke-width="1"/>

    <!-- ENCABEZADO -->
    <rect x="25" y="25" width="1550" height="65" fill="#06182e"/>
    <text x="50" y="58" fill="#00f0ff" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold">PL-06B: DETALLE GEOMÉTRICO, COTAS Y MECÁNICA DE PERNOS ESTRUCTURALES CLASE 10.9</text>
    <text x="50" y="78" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="12">ESPECIFICACIÓN ISO 4014 / EN 14399-4 PARA PERNOS M39 Y M45, DIAGRAMA DE RÖTSCHER Y ENSAMBLE DE BRIDAS</text>

    <!-- PANEL 1: ELEVACIÓN SECCIONADA DEL PERNO AISLADO (x=50 a 530) -->
    <g transform="translate(50, 110)">
        <rect width="470" height="520" fill="#071b30" stroke="#1e3a5f" stroke-width="1.5" rx="6"/>
        <rect width="470" height="28" fill="#0d2b4d" rx="6"/>
        <text x="15" y="19" fill="#ffd166" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">FIGURA 1: GEOMETRÍA NORMALIZADA DEL PERNO (ISO 4014)</text>

        <!-- CABEZA HEXAGONAL Y VÁSTAGO -->
        <g transform="translate(180, 50)">
            <!-- Cabeza -->
            <path d="M -60 0 L 60 0 L 52 35 L -52 35 Z" fill="url(#steel-bolt)" stroke="#00f0ff" stroke-width="2"/>
            <line x1="-30" y1="0" x2="-26" y2="35" stroke="#1e293b" stroke-width="1.5"/>
            <line x1="30" y1="0" x2="26" y2="35" stroke="#1e293b" stroke-width="1.5"/>
            <!-- Radio bajo cabeza r -->
            <path d="M -22 35 Q -22 40 -19.5 40" fill="none" stroke="#ffd166" stroke-width="2"/>
            <path d="M 22 35 Q 22 40 19.5 40" fill="none" stroke="#ffd166" stroke-width="2"/>
            
            <!-- Vástago liso d -->
            <rect x="-19.5" y="40" width="39" height="150" fill="url(#steel-bolt)" stroke="#00f0ff" stroke-width="2"/>
            <!-- Línea de simetría de trazo y punto -->
            <line x1="0" y1="-20" x2="0" y2="390" stroke="#ff0055" stroke-dasharray="8,4,2,4" stroke-width="1.5"/>

            <!-- Zona roscada b -->
            <rect x="-19.5" y="190" width="39" height="130" fill="#0f172a" stroke="#ffd166" stroke-width="2"/>
            <!-- Dientes de rosca métrica 60° -->
            <path d="
                M -19.5 190 L -21.5 195 L -19.5 200 L -21.5 205 L -19.5 210 L -21.5 215 L -19.5 220 L -21.5 225 L -19.5 230 L -21.5 235 L -19.5 240 L -21.5 245 L -19.5 250 L -21.5 255 L -19.5 260 L -21.5 265 L -19.5 270 L -21.5 275 L -19.5 280 L -21.5 285 L -19.5 290 L -21.5 295 L -19.5 300 L -21.5 305 L -19.5 310 L -21.5 315 L -19.5 320
                L 19.5 320 L 21.5 315 L 19.5 310 L 21.5 305 L 19.5 300 L 21.5 295 L 19.5 290 L 21.5 285 L 19.5 280 L 21.5 275 L 19.5 270 L 21.5 265 L 19.5 260 L 21.5 255 L 19.5 250 L 21.5 245 L 19.5 240 L 21.5 235 L 19.5 230 L 21.5 225 L 19.5 220 L 21.5 215 L 19.5 210 L 21.5 205 L 19.5 200 L 21.5 195 L 19.5 190 Z
            " fill="#1e293b" stroke="#ffd166" stroke-width="1.5"/>

            <!-- Chaflán de punta cónica a 45° -->
            <path d="M -19.5 320 L -16 328 L 16 328 L 19.5 320 Z" fill="#334155" stroke="#00f0ff" stroke-width="1.5"/>

            <!-- ACOTACIONES -->
            <!-- Ancho entre caras s -->
            <line x1="-60" y1="-10" x2="60" y2="-10" stroke="#00f0ff" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
            <text x="0" y="-15" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">s = 60.0 mm (M39) / 70.0 mm (M45)</text>

            <!-- Altura de cabeza k -->
            <line x1="75" y1="0" x2="75" y2="35" stroke="#00f0ff" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
            <text x="82" y="21" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold">k = 25 mm / 29 mm</text>

            <!-- Diámetro vástago d -->
            <line x1="-19.5" y1="100" x2="19.5" y2="100" stroke="#ffd166" stroke-width="1.2" marker-start="url(#arrow-gold)" marker-end="url(#arrow-gold)"/>

            <!-- Longitud vástago liso ls -->

            <text x="-56" y="260" fill="#ffd166" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" text-anchor="end">b = 70 mm</text>

            <!-- Longitud nominal total L -->
            <line x1="95" y1="35" x2="95" y2="328" stroke="#00f0ff" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
            <text x="103" y="185" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">L = 180 mm / 200 mm</text>

        </g>

        <!-- Detalle de marcado de cabeza -->
        <g transform="translate(60, 410)">
            <circle cx="50" cy="50" r="45" fill="#0d2847" stroke="#00f0ff" stroke-width="2"/>
            <polygon points="50,12 83,31 83,69 50,88 17,69 17,31" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
            <text x="50" y="44" fill="#ffd166" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">10.9</text>
            <text x="50" y="62" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SAEZ</text>
            <text x="110" y="42" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold">Marcado en Cabeza (Relieve):</text>
            <text x="110" y="58" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Clase 10.9 (f_ub = 1 000 MPa, f_yb = 900 MPa)</text>
            <text x="110" y="73" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">Sello de fabricante SAEZ y trazabilidad de lote</text>
        </g>
    </g>

    <!-- PANEL 2: ENSAMBLE BRIDA-PERNO-TUERCA Y CONO DE RÖTSCHER (x=540 a 1060) -->
    <g transform="translate(540, 110)">
        <rect width="500" height="520" fill="#071b30" stroke="#1e3a5f" stroke-width="1.5" rx="6"/>
        <rect width="500" height="28" fill="#0d2b4d" rx="6"/>
        <text x="15" y="19" fill="#ffd166" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">FIGURA 2: ENSAMBLE APERNADO Y CONO DE PRESIÓN (VDI 2230)</text>

        <g transform="translate(250, 70)">
            <!-- Brida Superior (t1 = 50 mm) -->
            <rect x="-160" y="50" width="320" height="70" fill="url(#flange-grad)" stroke="#00f0ff" stroke-width="1.5"/>
            <!-- Brida Inferior (t2 = 50 mm) -->
            <rect x="-160" y="120" width="320" height="70" fill="url(#flange-grad)" stroke="#00f0ff" stroke-width="1.5"/>
            <!-- Línea de contacto entre bridas (Plano de junta) -->
            <line x1="-160" y1="120" x2="160" y2="120" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="4,2"/>

            <!-- Agujero pasante d0 = d + 2 mm -->
            <rect x="-21" y="50" width="42" height="140" fill="#06121e" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>

            <!-- CONOS DE COMPRESIÓN DE RÖTSCHER (Ángulo 30°) -->
            <polygon points="-36,50 36,50 75,120 -75,120" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>
            <polygon points="-75,120 75,120 36,190 -36,190" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>

            <!-- ARANDELA SUPERIOR (DIN 6916, h = 6 mm, D = 72 mm) -->
            <rect x="-36" y="44" width="72" height="6" fill="#ffd166" stroke="#000" stroke-width="1"/>
            <!-- CABEZA DE PERNO SUPERIOR -->
            <path d="M -30 9 L 30 9 L 26 44 L -26 44 Z" fill="url(#steel-bolt)" stroke="#00f0ff" stroke-width="2"/>

            <!-- CUERPO DEL PERNO EN EL ENSAMBLE -->
            <rect x="-19.5" y="44" width="39" height="152" fill="url(#steel-bolt)" stroke="#00f0ff" stroke-width="1.5"/>
            <!-- Zona de contacto rosca-tuerca -->
            <rect x="-19.5" y="196" width="39" height="70" fill="#1e293b" stroke="#ffd166" stroke-width="1.5"/>

            <!-- ARANDELA INFERIOR (DIN 6916, h = 6 mm) -->
            <rect x="-36" y="190" width="72" height="6" fill="#ffd166" stroke="#000" stroke-width="1"/>

            <!-- TUERCA HEXAGONAL PESADA -->
            <path d="M -30 227 L 30 227 L 26 196 L -26 196 Z" fill="url(#steel-bolt)" stroke="#00f0ff" stroke-width="2"/>

            <!-- Saliente de rosca mínima (≥ 2 filetes = 8 mm) -->
            <rect x="-19.5" y="227" width="39" height="25" fill="#334155" stroke="#ffd166" stroke-width="1.2"/>
            <line x1="-19.5" y1="235" x2="19.5" y2="235" stroke="#ffd166" stroke-width="1"/>
            <line x1="-19.5" y1="243" x2="19.5" y2="243" stroke="#ffd166" stroke-width="1"/>

            <!-- LÍNEA DE EJE VERTICAL -->
            <line x1="0" y1="-10" x2="0" y2="270" stroke="#ff0055" stroke-dasharray="8,4,2,4" stroke-width="1.2"/>

            <!-- CORRECCIÓN 1: CAJA OPACA PARA PRECARGA (EVITA SOLAPAMIENTO CON LÍNEA ROJA) -->
            <rect x="-135" y="-12" width="270" height="24" fill="#071b30" stroke="#ef4444" stroke-width="1.2" rx="4"/>
            <text x="0" y="4" fill="#ef4444" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">PRECARGA F_p = 683.2 kN (70% f_ub)</text>
            <line x1="-80" y1="12" x2="-80" y2="40" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
            <line x1="80" y1="12" x2="80" y2="40" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>

            <!-- COTAS DEL ENSAMBLE -->
            <!-- Espesor Brida Sup t1 -->
            <line x1="-175" y1="50" x2="-175" y2="120" stroke="#00f0ff" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
            <text x="-182" y="88" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="end">t_1 = 50 mm</text>

            <!-- Espesor Brida Inf t2 -->
            <line x1="-175" y1="120" x2="-175" y2="190" stroke="#00f0ff" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
            <text x="-182" y="158" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="end">t_2 = 50 mm</text>

            <!-- CORRECCIÓN 2: COTA DERECHA Lk MOVIDA HACIA ADENTRO (x=115) PARA EVITAR CHOQUE CON BORDE -->
            <line x1="120" y1="44" x2="120" y2="196" stroke="#ffd166" stroke-width="1.5" marker-start="url(#arrow-gold)" marker-end="url(#arrow-gold)"/>
            <text x="128" y="115" fill="#ffd166" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">L_k = t_1 + t_2 + 2·h</text>
            <text x="128" y="130" fill="#ffd166" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">= 112 mm (M39)</text>

            <!-- Saliente de rosca p_min -->
            <line x1="45" y1="227" x2="45" y2="252" stroke="#00f0ff" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
            <text x="52" y="242" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="9.5">&#8805; 2 pasos (8 mm)</text>

            <!-- Ángulo de Rötscher tan 30° -->
            <line x1="36" y1="50" x2="75" y2="120" stroke="#38bdf8" stroke-width="1.5"/>
            <text x="82" y="85" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10">&#945; &#8776; 30&#176;</text>

            <!-- Vector de par manométrico Mt -->
            <path d="M 50 215 A 25 25 0 0 1 75 235" fill="none" stroke="#ffd166" stroke-width="2.5" marker-end="url(#arrow-gold)"/>
            <text x="85" y="230" fill="#ffd166" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold">M_t = 3 730 N&#183;m</text>
        </g>

        <!-- Notas de Rötscher -->
        <g transform="translate(20, 390)">
            <rect width="460" height="115" fill="#041220" stroke="#0284c7" stroke-width="1" rx="4"/>
            <text x="12" y="20" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold">PRINCIPIO MECÁNICO DE RÖTSCHER (VDI 2230):</text>
            <text x="12" y="38" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="9.5">&#8226; Rigidez del perno: k_b = E_b &#183; A_s / L_s | Rigidez bridas: k_m &gt;&gt; k_b (k_m &#8776; 9 &#183; k_b).</text>
            <text x="12" y="55" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="9.5">&#8226; Fracción de carga dinámica al perno: &#934; = k_b / (k_b + k_m) &#8776; 0.10 (solo el 10% de carga eólica).</text>
            <text x="12" y="72" fill="#ffd166" font-family="'Segoe UI', sans-serif" font-size="9.5">&#8226; El 90% restante alivia la compresión previa de las bridas, confiriendo vida infinita a fatiga.</text>
            <text x="12" y="90" fill="#a0c4e2" font-family="'Segoe UI', sans-serif" font-size="9.5">&#8226; Reapriete obligatorio tras 48 h: absorbe el asentamiento micrométrico de pinturas y rugosidades.</text>
        </g>
    </g>

    <!-- PANEL 3: DETALLE DE PERFIL DE ROSCA MÉTRICA ISO Y TABLA COMPARATIVA (x=1060 a 1550) -->
    <g transform="translate(1060, 110)">
        <rect width="490" height="520" fill="#071b30" stroke="#1e3a5f" stroke-width="1.5" rx="6"/>
        <rect width="490" height="28" fill="#0d2b4d" rx="6"/>
        <text x="15" y="19" fill="#ffd166" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">FIGURA 3: PERFIL ROSCA ISO 60&#176; Y MATRIZ M39 / M45</text>

        <!-- Gráfico del filete de rosca -->
        <g transform="translate(160, 50)">
            <!-- Triángulo fundamental H = 0.866 P -->
            <polygon points="0,20 60,180 -60,180" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
            <polygon points="120,20 180,180 60,180" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>

            <!-- Perfil real del tornillo -->
            <path d="
                M -70 180
                L -52 140
                Q -45 125 -30 125
                L 0 50
                L 30 125
                Q 45 125 52 140
                L 70 180
                L 88 140
                Q 95 125 110 125
                L 140 50
            " fill="none" stroke="#ffd166" stroke-width="3"/>

            <!-- Ángulo de 60° -->
            <path d="M -15 85 A 30 30 0 0 0 15 85" fill="none" stroke="#00f0ff" stroke-width="1.8"/>
            <text x="0" y="105" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">60&#176;</text>

            <!-- Cotas de rosca -->
            <line x1="0" y1="35" x2="140" y2="35" stroke="#00f0ff" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
            <text x="70" y="27" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Paso P = 4.0 mm (M39) / 4.5 mm (M45)</text>

            <!-- Altura H -->
            <line x1="160" y1="20" x2="160" y2="180" stroke="#94a3b8" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
            <text x="168" y="105" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9.5">H = 0.866&#183;P</text>

            <!-- Truncamiento H/8 -->
            <line x1="-30" y1="50" x2="-30" y2="20" stroke="#ef4444" stroke-width="1"/>
            <text x="-35" y="38" fill="#ef4444" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="end">H/8 = 0.108&#183;P</text>

            <!-- Radio de fondo de rosca r -->
            <text x="70" y="195" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="9.5" text-anchor="middle">Radio ra&#237;z r = 0.144&#183;P (Anti-fatiga)</text>
        </g>

        <!-- CORRECCIÓN 3: TABLA COMPARATIVA ESTRUCTURADA LIMPIA (SIN & SUELTO) -->
        <g transform="translate(15, 290)">
            <rect x="0" y="0" width="460" height="215" fill="#041220" stroke="#1e3a5f" stroke-width="1" rx="4"/>
            <rect x="0" y="0" width="460" height="22" fill="#133863" rx="4"/>
            <text x="10" y="15" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">PAR&#193;METRO MEC&#193;NICO</text>
            <text x="195" y="15" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">SAEZ S-46 (M39)</text>
            <text x="330" y="15" fill="#ffd166" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">SAEZ TLS 70 (M45)</text>
            
            <text x="10" y="40" fill="#a0c4e2" font-family="'Segoe UI', sans-serif" font-size="8.5">Norma de Producto</text>
            <text x="195" y="40" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="8.5">ISO 4014 / EN 14399-4</text>
            <text x="330" y="40" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="8.5">ISO 4014 / EN 14399-4</text>
            <line x1="5" y1="48" x2="455" y2="48" stroke="#1d436a" stroke-width="0.5" />
            
            <text x="10" y="63" fill="#a0c4e2" font-family="'Segoe UI', sans-serif" font-size="8.5">Clase de Resistencia</text>
            <text x="195" y="63" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="bold">Clase 10.9 (f_yb = 900 MPa)</text>
            <text x="330" y="63" fill="#ffd166" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="bold">Clase 10.9 (f_yb = 900 MPa)</text>
